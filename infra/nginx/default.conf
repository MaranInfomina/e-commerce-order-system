upstream php_upstream {
    server php-fpm:9000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    root /var/www/html/public;
    index index.php;

    # API: everything under /api is handled by Laravel's front controller.
    # ^~ so this also matches the bare /api (no trailing slash), which would
    # otherwise fall through to the location / proxy below.
    location ^~ /api {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    # Frontend: everything else is proxied to the Nuxt SSR server.
    location / {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;

        # Required for the Vite HMR websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
