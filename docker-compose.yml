services:
  nginx:
    build: ./infra/nginx
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    environment:
      # Templated into infra/nginx/default.conf.template's HTTP->HTTPS
      # redirect via the base image's envsubst-on-templates entrypoint.
      APP_HTTPS_PORT: ${APP_HTTPS_PORT:-8443}
    volumes:
      - ./src/backend:/var/www/html
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      php-fpm:
        condition: service_started
      nuxt:
        condition: service_started
      # Not just ordering: the /storage/ location below names `garage` as an
      # upstream, and nginx resolves upstream names at config load and EXITS
      # if the name does not resolve. service_healthy rather than
      # service_started because a garage that crash-loops on a bad
      # GARAGE_RPC_SECRET satisfies service_started the instant the container
      # is created, hiding the failure until an upload times out.
      garage:
        condition: service_healthy

  php-fpm:
    build: ./src/backend
    environment:
      APP_NAME: ${APP_NAME:-COE Order System}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-session}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-coe_orders}
      DB_USERNAME: ${DB_USERNAME:-coe}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_only}
      DB_TEST_DATABASE: ${POSTGRES_TEST_DB:-coe_orders_test}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-0}
      REDIS_DB: ${REDIS_DB:-1}
      REDIS_SESSION_DB: ${REDIS_SESSION_DB:-2}
      REDIS_TEST_DB: ${REDIS_TEST_DB:-15}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-3600}
      CACHE_PREFIX: ${CACHE_PREFIX:-}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-garage}
      AWS_BUCKET: ${AWS_BUCKET:-coe-products}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://garage:3900}
      # A CLIENT-reachable address, never the compose-internal one above:
      # Flysystem would otherwise publish http://garage:3900/... in every
      # product response. /storage/ is proxied to Garage's web endpoint by
      # infra/nginx/default.conf.
      AWS_URL: ${AWS_URL:-http://localhost:8080/storage}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-orders}
      # php-fpm never sends mail itself, but Laravel resolves
      # config('mail.mailers.smtp') (and therefore these env vars) whenever
      # the Mail facade or a queued Mailable is constructed — and php-fpm is
      # where a later task builds that Mailable before handing it to the job
      # that actually sends it from the queue-worker container.
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-orders@coe.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-COE Order System}
      # OTLP over plain HTTP (port 4318), not gRPC (4317): ext-grpc is not
      # installed in this image, and open-telemetry/exporter-otlp's bundled
      # OtlpHttpTransportFactory works over a PSR-18 client (Guzzle, already
      # a Laravel dependency) with no extra PHP extension required.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-coe-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # The SDK's default BatchSpanProcessor exports on a scheduled delay
      # (5s) driven by a background fiber — a model built for a long-running
      # process, not a php-fpm worker that tears down at the end of every
      # request. Left on the default, a span could simply never be flushed
      # before the process recycles. SimpleSpanProcessor exports
      # synchronously the moment a span ends, which is the correct trade-off
      # here: one extra blocking HTTP call per traced request/job, in
      # exchange for a trace that reliably reaches Jaeger at all.
      OTEL_PHP_TRACES_PROCESSOR: ${OTEL_PHP_TRACES_PROCESSOR:-simple}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-true}
      # L5-Swagger's own recommended dev setting: regenerate storage/api-docs/
      # api-docs.json from the OA attributes on every request to /api-docs,
      # instead of only whenever someone happens to run
      # `artisan l5-swagger:generate` by hand. Without this, a genuinely
      # fresh clone's /docs/api-docs 404 until that command is run manually —
      # nothing in this entrypoint runs it, and the generated file lives on
      # the host bind mount, not a named volume, so a stale or missing copy
      # doesn't get regenerated by anything else either.
      L5_SWAGGER_GENERATE_ALWAYS: ${L5_SWAGGER_GENERATE_ALWAYS:-true}
    volumes:
      - ./src/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage_framework:/var/www/html/storage/framework
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coe_orders}
      POSTGRES_USER: ${POSTGRES_USER:-coe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-coe_orders_test}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coe} -d ${POSTGRES_DB:-coe_orders}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    # appendonly makes the cart survive a container restart, which is the
    # stronger and more demonstrable form of FR-20's "persists".
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  garage:
    image: dxflrs/garage:v1.0.1
    environment:
      # The cluster RPC credential. Kept out of infra/garage/garage.toml so it
      # never enters tracked source. The default below is an obvious throwaway
      # that exists only so a clean clone boots (CR-3) - ./setup.sh overwrites
      # it with a random 32-byte hex value, and docker-compose.prod.yml refuses
      # to start without a real one.
      # EXACTLY 64 hex characters (32 bytes). Garage refuses to start on
      # anything else, and `depends_on: service_started` would not catch it.
      # Verify with:
      #   printf '%s' '<value>' | wc -c                    -> 64
      #   printf '%s' '<value>' | tr -d '0-9a-f' | wc -c   -> 0
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      # `garage status` speaks the cluster RPC protocol, so an invalid
      # GARAGE_RPC_SECRET or an unparsable garage.toml fails it. Every other
      # dependency in this file uses service_healthy; without one here, a
      # crash-looping garage satisfies `service_started` instantly and the
      # failure surfaces much later as an upload that times out.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      # Management UI only, localhost-bound — a developer convenience, not
      # part of the served application, same treatment as Garage's console.
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      # Exec form, no shell needed — rabbitmq-diagnostics is a real binary on
      # this image, unlike the scratch-based mailpit image a later task adds.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  mailpit:
    # v1 (bare) is not a published tag on Docker Hub — only `latest`, `edge`,
    # and minor-pinned tags like v1.31 exist. v1.31 is the newest v1.x minor
    # at the time this was written, matching the plan's intent of pinning to
    # the v1 major line without floating on `latest`.
    image: axllent/mailpit:v1.31
    ports:
      # Web UI only, localhost-bound — dev convenience, matching Garage's
      # console and RabbitMQ's management UI. SMTP (1025) is internal-only.
      - "127.0.0.1:8025:8025"
    # No healthcheck: the image is built FROM scratch with only the mailpit
    # binary, no shell and no wget/curl to run one with. php-fpm/queue-worker
    # depend on it with service_started rather than service_healthy below —
    # an SMTP send that races a still-booting Mailpit fails loudly (visible
    # in the confirmation-email test), which is an acceptable trade-off for a
    # dev-only mail catcher with no production equivalent.

  queue-worker:
    build: ./src/backend
    # Same image as php-fpm, different command — the established
    # one-container-one-job convention (nginx/php-fpm/nuxt are already split
    # this way). --tries/--backoff here are the worker's defaults; individual
    # jobs may still override $tries/$backoff on themselves.
    command: ["php", "artisan", "queue:work", "rabbitmq", "--queue=orders", "--tries=3", "--backoff=10"]
    environment:
      APP_NAME: ${APP_NAME:-COE Order System}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-session}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-rabbitmq}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-coe_orders}
      DB_USERNAME: ${DB_USERNAME:-coe}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_only}
      DB_TEST_DATABASE: ${POSTGRES_TEST_DB:-coe_orders_test}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-0}
      REDIS_DB: ${REDIS_DB:-1}
      REDIS_SESSION_DB: ${REDIS_SESSION_DB:-2}
      REDIS_TEST_DB: ${REDIS_TEST_DB:-15}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-3600}
      CACHE_PREFIX: ${CACHE_PREFIX:-}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-garage}
      AWS_BUCKET: ${AWS_BUCKET:-coe-products}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://garage:3900}
      AWS_URL: ${AWS_URL:-http://localhost:8080/storage}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-orders}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-orders@coe.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-COE Order System}
      # Same reasoning as php-fpm's identical pair above: HTTP transport
      # (4318), not gRPC, and the same OTEL_SERVICE_NAME so both containers'
      # spans land on the same Jaeger service and can be joined into one trace.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-coe-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # Same reasoning as php-fpm's identical setting above.
      OTEL_PHP_TRACES_PROCESSOR: ${OTEL_PHP_TRACES_PROCESSOR:-simple}
      # AUTO_MIGRATE/AUTO_SEED default to false here even though the base env
      # var defaults to true: this container shares docker-entrypoint.sh with
      # php-fpm, and running migrate --force from two containers on every
      # `docker compose up` is a harmless race today but an unnecessary one —
      # php-fpm already owns migration/seeding.
      AUTO_MIGRATE: "false"
      AUTO_SEED: "false"
    volumes:
      - ./src/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage_framework:/var/www/html/storage/framework
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
      # No healthcheck on mailpit (see its service definition above), so this
      # is service_started rather than service_healthy like every other
      # dependency here — the SendOrderConfirmation job (a later task) sends
      # mail from this container, and a send that races a still-booting
      # Mailpit fails loudly rather than silently, which is acceptable for a
      # dev-only mail catcher.
      mailpit:
        condition: service_started
      # Ordering only, not a guarantee: php-fpm has no HEALTHCHECK of its own
      # (nginx already depends on it with the same service_started condition
      # today), so this does not wait for php-fpm's entrypoint to finish
      # composer install or clearing bootstrap/cache — only for its container
      # to have started. Both containers share the backend_vendor and
      # backend_bootstrap_cache named volumes and run the same entrypoint
      # script, so a genuinely simultaneous first boot can still race a
      # composer install against a cache-clear. Accepted as a known,
      # low-probability limitation rather than inventing a new health-gating
      # mechanism this project has never used.
      php-fpm:
        condition: service_started

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.58
    ports:
      - "127.0.0.1:16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  vault:
    image: hashicorp/vault:1.17
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      # Dev mode: in-memory storage, auto-unsealed, a fixed root token —
      # explicitly dev-grade only, matching this project's existing
      # treatment of Garage's RPC secret default and the self-signed TLS
      # cert (a separate task) as training-only concerns.
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-coe-dev-root-token}
      VAULT_ADDR: http://127.0.0.1:8200

  nuxt:
    build:
      context: ./src/frontend
      target: prod
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_BASE_SERVER: http://nginx/api/v1
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"

volumes:
  pgdata:
  redisdata:
  garagemeta:
  garagedata:
  rabbitmqdata:
  lokidata:
  backend_vendor:
  backend_storage_framework:
  backend_bootstrap_cache:
  prometheusdata:
  grafanadata:
